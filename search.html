<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索结果 - 行业信息差日报</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2d6;--accent:#c8402a;--blue:#2c4a78}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.container{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.header{padding:20px 0;border-bottom:2px solid var(--ink);margin-bottom:16px}
.header h1{font-size:20px;font-weight:800}
.header .back{display:inline-block;margin-top:8px;color:var(--blue);text-decoration:none;font-size:14px}
.result-info{font-size:14px;color:var(--muted);margin-bottom:16px}
.result-info b{color:var(--accent)}
.news-list{display:flex;flex-direction:column;gap:12px}
.news-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.news-card h3{font-size:15.5px;font-weight:600;line-height:1.5}
.news-card h3 a{color:var(--ink);text-decoration:none}
.news-card h3 a:hover{color:var(--accent)}
.news-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.badge{background:#eef2f7;color:var(--blue);padding:1px 8px;border-radius:4px;font-size:11px}
.badge.cat{background:#f7e8e3;color:var(--accent)}
.news-summary{font-size:13px;color:#444;margin-top:8px}
.detail-btn{display:inline-block;margin-top:10px;padding:6px 14px;background:var(--blue);color:#fff;text-decoration:none;border-radius:6px;font-size:13px}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.empty a{color:var(--blue);text-decoration:none}
.error{text-align:center;padding:40px;color:var(--accent);font-size:14px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>搜索结果</h1>
    <a class="back" href="index.html">← 返回首页</a>
  </div>
  <div class="result-info" id="resultInfo"></div>
  <div class="news-list" id="resultList"><div class="empty">加载中…</div></div>
</div>

<script>
function fmtTime(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  var pad = function(n){return String(n).padStart(2,"0");};
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function getQuery(name){
  var m = new RegExp("[?&]"+name+"=([^&]*)").exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
}
var kw = getQuery("q");
document.getElementById("resultInfo").textContent = "搜索：" + kw + " · 加载中…";

async function load(){
  try{
    var res = await fetch("data.json?t=" + Date.now());
    var data = await res.json();
    var items = data.items || [];
    var k = kw.toLowerCase();
    var matched = items.filter(function(it){
      return (it.title||"").toLowerCase().indexOf(k)>=0
          || (it.source||"").toLowerCase().indexOf(k)>=0
          || (it.summary||"").toLowerCase().indexOf(k)>=0;
    });
    document.getElementById("resultInfo").innerHTML =
      "搜索：<b>"+esc(kw)+"</b> · 共 "+matched.length+" 条相关资源";
    if(!matched.length){
      document.getElementById("resultList").innerHTML =
        '<div class="empty">没有找到相关资源<br><br><a href="index.html">返回首页</a></div>';
      return;
    }
    document.getElementById("resultList").innerHTML = matched.map(function(it){
      return '<div class="news-card">'+
        '<h3><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></h3>'+
        '<div class="news-meta"><span class="badge cat">'+esc(it.category||"")+'</span><span>'+esc(it.source||"")+'</span><span>'+fmtTime(it.published)+'</span></div>'+
        (it.summary?'<div class="news-summary">'+esc(it.summary)+'</div>':'')+
        '<a class="detail-btn" href="detail.html?id='+esc(it.id)+'">查看详情 →</a>'+
      '</div>';
    }).join("");
  }catch(e){
    document.getElementById("resultList").innerHTML = '<div class="error">数据加载失败：'+esc(e.message)+'</div>';
  }
}
load();
</script>
</body>
</html>
