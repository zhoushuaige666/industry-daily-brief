<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行业信息差日报</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2d6;--accent:#c8402a;--hot:#d97706;--blue:#2c4a78}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.container{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header{padding:28px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:8px}
h1{font-size:26px;font-weight:800;letter-spacing:2px}
.sub{color:var(--muted);font-size:13px;margin-top:8px}
.search{margin:14px 0;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10}
.search-box{display:flex;gap:8px}
.search-box input{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;outline:none}
.search-box button{padding:0 20px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer}
.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;color:#fff}
.tag.hot{background:var(--hot)}.tag.latest{background:var(--blue)}
.hot-list{display:grid;gap:10px}
.hot-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px}
.hot-rank{font-size:18px;font-weight:800;color:var(--hot);min-width:26px;font-family:Georgia,serif}
.hot-body a{color:var(--ink);text-decoration:none;font-weight:500;font-size:14.5px;display:block}
.hot-body a:hover{color:var(--accent)}
.hot-meta{font-size:12px;color:var(--muted);margin-top:4px}
.news-list{display:flex;flex-direction:column;gap:12px}
.news-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.news-card h3{font-size:15.5px;font-weight:600;line-height:1.5}
.news-card h3 a{color:var(--ink);text-decoration:none}
.news-card h3 a:hover{color:var(--accent)}
.news-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.badge{background:#eef2f7;color:var(--blue);padding:1px 8px;border-radius:4px;font-size:11px}
.badge.cat{background:#f7e8e3;color:var(--accent)}
.news-summary{font-size:13px;color:#444;margin-top:8px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>行业信息差日报</h1>
    <div class="sub">科技 / AI / 商业 / 创投 · 每天北京时间 08:00 自动更新</div>
  </header>

  <div class="search">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索关键词，回车跳转结果页…">
      <button id="searchBtn">搜索</button>
    </div>
  </div>

  <div class="section-title">热门<span class="tag hot">HN Top 20</span></div>
  <div class="hot-list" id="hotList"><div class="empty">加载中…</div></div>

  <div class="section-title">最新资讯<span class="tag latest" id="latestCount">--</span></div>
  <div class="news-list" id="newsList"><div class="empty">加载中…</div></div>

  <footer>
    数据来源：36氪、少数派、Solidot、爱范儿、虎嗅、钛媒体、极客公园、Hacker News。
  </footer>
</div>

<script>
function fmtTime(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  var pad = function(n){return String(n).padStart(2,"0");};
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function fmtRelative(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  var diff = Math.floor((new Date()-d)/1000);
  if(diff<60) return "刚刚";
  if(diff<3600) return Math.floor(diff/60)+" 分钟前";
  if(diff<86400) return Math.floor(diff/3600)+" 小时前";
  return Math.floor(diff/86400)+" 天前";
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function doSearch(){
  var kw = document.getElementById("searchInput").value.trim();
  if(kw){ location.href = "search.html?q=" + encodeURIComponent(kw); }
}
document.getElementById("searchBtn").addEventListener("click", doSearch);
document.getElementById("searchInput").addEventListener("keydown", function(e){
  if(e.key === "Enter") doSearch();
});
async function load(){
   try{
     var res = await fetch("data.json?t=" + Date.now());
     var data = await res.json();
     document.getElementById("latestCount").textContent = (data.items||[]).length + " 条";
     var hot = data.hot || [];
     document.getElementById("hotList").innerHTML = hot.map(function(it,i){
       return '<div class="hot-item"><div class="hot-rank">'+(i+1)+'</div><div class="hot-body">'+
         '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'+
         '<div class="hot-meta">'+it.score+' 分 · '+(it.comments||0)+' 评论 · '+esc(it.by||"")+'</div></div></div>';
     }).join("");
     var items = (data.items||[]).slice(0,20);
     document.getElementById("newsList").innerHTML = items.map(function(it){
       return '<div class="news-card"><h3><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></h3>'+
         '<div class="news-meta"><span class="badge cat">'+esc(it.category||"")+'</span><span>'+esc(it.source||"")+'</span><span>'+fmtRelative(it.published)+'</span></div>'+
         (it.summary?'<div class="news-summary">'+esc(it.summary)+'</div>':'')+'</div>';
     }).join("");
   }catch(e){
     document.getElementById("newsList").innerHTML = '<div class="empty">数据加载失败：'+esc(e.message)+'</div>';
   }
 }
 load();
 </script>
 </body>
 </html>
